name: Backend Compile Check

on:
  push:
    branches:
      - feat/interswitch-merchant-pos-foundation-20260913
      - feat/interswitch-acquiring-contracts-20260913
      - feat/wave-pos-api-contract-20260913
      - feat/pos-terminal-pairing-session-20260913
      - test/pos-session-safety-20260913
      - test/provider-terminal-link-state-20260913
      - feat/provider-event-ingress-20260913
      - feat/terminal-provisioning-orchestrator-20260913
      - feat/card-issuing-foundation-20260914
      - feat/live-electricity-tv-services-20260914
      - feat/live-smile-internet-20260914
      - feat/live-waec-result-checker-20260914
      - feat/live-waec-registration-20260914
      - feat/live-jamb-pin-20260914
      - feat/interswitch-bank-transfers-20260914
      - feat/external-bank-transfer-ledger-20260914
      - feat/external-bank-transfer-orchestration-20260914
      - feat/provider-neutral-account-funding-20260916
      - feat/provider-neutral-funding-events-20260916
      - feat/funding-credit-policy-reconciliation-20260916
      - fix/render-docker-entrypoint-20260916
      - feat/funding-reconciliation-operations-20260916
      - feat/api-request-correlation-20260916
      - feat/distributed-rate-limits-20260916
      - feat/hashed-verification-codes-20260916
      - fix/auth-challenge-replay-20260916
      - fix/transaction-pin-authorization-20260916
      - fix/transaction-pin-lockout-20260916
      - fix/auth-epoch-session-revocation-20260916
      - fix/revoke-all-sessions-20260916
  pull_request:
    branches:
      - controlled-start-api-20260910
      - feat/interswitch-merchant-pos-foundation-20260913
      - feat/interswitch-acquiring-contracts-20260913
      - feat/wave-pos-api-contract-20260913
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and package without integration runtime
        run: mvn -B -DskipTests package

      - name: Run financial, merchant, card, transfer, observability, abuse-protection and authentication safety unit tests
        run: mvn -B -Dtest=ServicePaymentServiceTest,VtpassVerificationClientTest,VtpassSmileClientTest,SmilePaymentServiceTest,ServiceFulfillmentCryptoTest,WaecPaymentServiceTest,VtpassWaecPurchaseClientTest,JambPaymentServiceTest,VtpassJambPurchaseClientTest,InterswitchBankTransferGatewayTest,ExternalBankTransferOrchestratorTest,ExternalBankTransferPinAuthorizationTest,CustomerFundingAccountServiceTest,CustomerFundingEventServiceTest,CustomerFundingCreditServiceTest,CustomerFundingOperationsServiceTest,ProviderFundingLedgerServiceTest,MerchantReceiptPolicyTest,InterswitchMerchantAcquiringGatewayTest,InterswitchCardIssuingGatewayTest,WaveCardServiceTest,PosClientServiceTest,PosTerminalSessionServiceTest,ProviderTerminalLinkServiceTest,ProviderEventIngressServiceTest,TerminalProvisioningServiceTest,ApiRequestContextFilterTest,DistributedRateLimitServiceTest,ApiRateLimitFilterTest,RateLimitGuardTest,VerificationServiceSecurityTest,VerificationAuthEpochTest,AuthServiceSecurityTest,FaceLoginChallengeServiceSecurityTest,JwtAuthEpochSecurityTest,PasswordResetAuthEpochTest,SessionRevocationServiceTest,TransactionPinGuardTest,AuthorizedTransferServiceTest,AuthorizedPaymentQrServiceTest,ServicePaymentPinAuthorizationTest test

      - name: Build Render Docker image
        run: docker build -t wave-transakt-api-ci .
