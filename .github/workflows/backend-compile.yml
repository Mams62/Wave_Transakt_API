name: Backend Compile Check

on:
  push:
    branches:
      - feat/interswitch-merchant-pos-foundation-20260913
      - feat/interswitch-acquiring-contracts-20260913
      - feat/wave-pos-api-contract-20260913
      - feat/pos-terminal-pairing-session-20260913
      - test/pos-session-safety-20260913
  pull_request:
    branches:
      - controlled-start-api-20260910
      - feat/interswitch-merchant-pos-foundation-20260913
      - feat/interswitch-acquiring-contracts-20260913
      - feat/wave-pos-api-contract-20260913
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and package without integration runtime
        run: mvn -B -DskipTests package

      - name: Run merchant safety unit tests
        run: mvn -B -Dtest=MerchantReceiptPolicyTest,InterswitchMerchantAcquiringGatewayTest,PosClientServiceTest,PosTerminalSessionServiceTest test
