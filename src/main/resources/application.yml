spring:
  application:
    name: WaveTransaktAPI

  datasource:
    url: ${WAVE_DB_URL:jdbc:postgresql://localhost:5432/WaveTransaktAPI}
    username: ${WAVE_DB_USERNAME:postgres}
    password: ${WAVE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${WAVE_SQL_LOGGING:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}
  forward-headers-strategy: framework

jwt:
  secret: ${WAVE_JWT_SECRET}
  expiration: ${WAVE_JWT_EXPIRATION:86400000}

# Paystack is retained only as legacy code while the controlled build moves to
# Wema Wallet Services. Blank defaults prevent it from being required at boot;
# no Android funding route should call it in this stage.
paystack:
  public-key: ${WAVE_PAYSTACK_PUBLIC_KEY:}
  secret-key: ${WAVE_PAYSTACK_SECRET_KEY:}

wema:
  # Playground gateway for Wallet Services. Production must use the gateway
  # Wema profiles for the Wave Transakt partnership.
  base-url: ${WAVE_WEMA_BASE_URL:https://playground.azure-api.net}
  wallet-subscription-key: ${WAVE_WEMA_WALLET_SUBSCRIPTION_KEY:}
  api-key: ${WAVE_WEMA_API_KEY:}
  access-key: ${WAVE_WEMA_ACCESS_KEY:}

vtpass:
  base-url: ${WAVE_VTPASS_BASE_URL:https://sandbox.vtpass.com/api/}
  api-key: ${WAVE_VTPASS_API_KEY:}
  public-key: ${WAVE_VTPASS_PUBLIC_KEY:}
  secret-key: ${WAVE_VTPASS_SECRET_KEY:}

wave:
  demo:
    return-verification-code: ${WAVE_RETURN_VERIFICATION_CODE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.wavetransakt: ${WAVE_LOG_LEVEL:INFO}
    org.springframework.security: WARN
