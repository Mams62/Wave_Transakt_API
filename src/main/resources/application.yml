spring:
  application:
    name: WaveTransaktAPI

  datasource:
    url: "${WAVE_DB_URL:jdbc:postgresql://${WAVE_DB_HOST:localhost}:${WAVE_DB_DB_PORT:5432}/${WAVE_DB_NAME:WaveTransaktAPI}}"
    username: ${WAVE_DB_USERNAME:postgres}
    password: ${WAVE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${WAVE_SQL_LOGGING:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}
  forward-headers-strategy: framework

jwt:
  secret: ${WAVE_JWT_SECRET}
  expiration: ${WAVE_JWT_EXPIRATION:86400000}

paystack:
  public-key: ${WAVE_PAYSTACK_PUBLIC_KEY:}
  secret-key: ${WAVE_PAYSTACK_SECRET_KEY:}

wema:
  wallet:
    base-url: ${WAVE_WEMA_WALLET_BASE_URL:https://playground.azure-api.net}
    subscription-key: ${WAVE_WEMA_WALLET_SUBSCRIPTION_KEY:}
    api-key: ${WAVE_WEMA_WALLET_API_KEY:}

  transfer:
    base-url: ${WAVE_WEMA_TRANSFER_BASE_URL:https://wema-alatdev-apimgt.azure-api.net}
    subscription-key: ${WAVE_WEMA_TRANSFER_SUBSCRIPTION_KEY:}
    api-key: ${WAVE_WEMA_TRANSFER_API_KEY:}
    channel-id: ${WAVE_WEMA_CHANNEL_ID:}
    salt: ${WAVE_WEMA_TRANSFER_SALT:}

  access-key: ${WAVE_WEMA_ACCESS_KEY:}

# Interswitch credentials remain server-side only. Consumer wallet, merchant
# acquiring/POS and card issuing are treated as separate provider products.
interswitch:
  enabled: ${WAVE_INTERSWITCH_ENABLED:false}
  client-id: ${WAVE_INTERSWITCH_CLIENT_ID:}
  client-secret: ${WAVE_INTERSWITCH_CLIENT_SECRET:}
  passport:
    token-url: ${WAVE_INTERSWITCH_PASSPORT_TOKEN_URL:https://passport-sandbox.interswitchng.com/passport/oauth/token}
  wallet:
    base-url: ${WAVE_INTERSWITCH_WALLET_BASE_URL:https://api-gateway.interswitchng.com/generic-wallet}
    domain: ${WAVE_INTERSWITCH_WALLET_DOMAIN:ISW}
    channel: ${WAVE_INTERSWITCH_WALLET_CHANNEL:SERVICE}
    id-type: ${WAVE_INTERSWITCH_WALLET_ID_TYPE:PHONE}
  acquiring:
    # Deliberately blank/disabled until Interswitch assigns the Wave Transakt
    # merchant/acquiring product configuration. Do not guess production hosts,
    # merchant codes or terminal identifiers.
    enabled: ${WAVE_INTERSWITCH_ACQUIRING_ENABLED:false}
    merchant-wallet-base-url: ${WAVE_INTERSWITCH_MERCHANT_WALLET_BASE_URL:}
    merchant-code: ${WAVE_INTERSWITCH_MERCHANT_CODE:}
    smart-pos-enabled: ${WAVE_INTERSWITCH_SMART_POS_ENABLED:false}
    contactless-enabled: ${WAVE_INTERSWITCH_CONTACTLESS_ENABLED:false}
  card:
    # A Card 360 / issuing agreement and approved card programme are required.
    issuing-enabled: ${WAVE_INTERSWITCH_CARD_ISSUING_ENABLED:false}

vtpass:
  base-url: ${WAVE_VTPASS_BASE_URL:https://sandbox.vtpass.com/api/}
  api-key: ${WAVE_VTPASS_API_KEY:}
  public-key: ${WAVE_VTPASS_PUBLIC_KEY:}
  secret-key: ${WAVE_VTPASS_SECRET_KEY:}

wave:
  demo:
    return-verification-code: ${WAVE_RETURN_VERIFICATION_CODE:false}

  app:
    android:
      latest-version-code: ${WAVE_ANDROID_LATEST_VERSION_CODE:1}
      latest-version-name: ${WAVE_ANDROID_LATEST_VERSION_NAME:1.0}
      download-url: ${WAVE_ANDROID_DOWNLOAD_URL:}
      force-update: ${WAVE_ANDROID_FORCE_UPDATE:false}
      release-notes: ${WAVE_ANDROID_RELEASE_NOTES:}

  sms:
    # Termii-compatible messaging endpoint. BASE URL must come from the SMS
    # provider dashboard and credentials must stay only in Render.
    base-url: ${WAVE_SMS_BASE_URL:}
    api-key: ${WAVE_SMS_API_KEY:}
    sender-id: ${WAVE_SMS_SENDER_ID:WavePay}
    channel: ${WAVE_SMS_CHANNEL:dnd}

  identity:
    liveness:
      provider: ${WAVE_LIVENESS_PROVIDER:DOJAH}
      provider-configured: ${WAVE_LIVENESS_PROVIDER_CONFIGURED:false}
      webhook-secret: ${WAVE_LIVENESS_WEBHOOK_SECRET:}
      dojah:
        base-url: ${WAVE_DOJAH_BASE_URL:https://api.dojah.io}
        app-id: ${WAVE_DOJAH_APP_ID:}
        api-key: ${WAVE_DOJAH_API_KEY:}

  legacy:
    paystack-enabled: ${WAVE_LEGACY_PAYSTACK_ENABLED:false}

  wallet:
    default-provider: ${WAVE_WALLET_DEFAULT_PROVIDER:INTERSWITCH}
    local-money-movement-enabled: ${WAVE_LOCAL_MONEY_MOVEMENT_ENABLED:false}

  services:
    provider-payments-enabled: ${WAVE_SERVICE_PAYMENTS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.wavetransakt: ${WAVE_LOG_LEVEL:INFO}
    org.springframework.security: WARN
