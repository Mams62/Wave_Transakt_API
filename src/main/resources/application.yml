spring:
  application:
    name: WaveTransaktAPI

  datasource:
    url: ${WAVE_DB_URL:jdbc:postgresql://localhost:5432/WaveTransaktAPI}
    username: ${WAVE_DB_USERNAME:postgres}
    password: ${WAVE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${WAVE_SQL_LOGGING:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}
  forward-headers-strategy: framework

jwt:
  secret: ${WAVE_JWT_SECRET}
  expiration: ${WAVE_JWT_EXPIRATION:86400000}

# Legacy Paystack code remains compile-time compatible only. No Render Paystack
# secrets are required for the Wema-controlled staging flow.
paystack:
  public-key: ${WAVE_PAYSTACK_PUBLIC_KEY:}
  secret-key: ${WAVE_PAYSTACK_SECRET_KEY:}

wema:
  # Wema publishes wallet/account-creation and transfer products through
  # different Azure API Management gateways in the developer environment.
  # Do not use the *.developer.azure-api.net portal hostname for API calls.
  wallet:
    base-url: ${WAVE_WEMA_WALLET_BASE_URL:https://playground.azure-api.net}
    subscription-key: ${WAVE_WEMA_WALLET_SUBSCRIPTION_KEY:}
    api-key: ${WAVE_WEMA_WALLET_API_KEY:}

  transfer:
    base-url: ${WAVE_WEMA_TRANSFER_BASE_URL:https://wema-alatdev-apimgt.azure-api.net}
    subscription-key: ${WAVE_WEMA_TRANSFER_SUBSCRIPTION_KEY:}
    api-key: ${WAVE_WEMA_TRANSFER_API_KEY:}
    channel-id: ${WAVE_WEMA_CHANNEL_ID:}
    salt: ${WAVE_WEMA_TRANSFER_SALT:}

  # Some Wema bills/airtime products use a separate access credential.
  access-key: ${WAVE_WEMA_ACCESS_KEY:}

vtpass:
  base-url: ${WAVE_VTPASS_BASE_URL:https://sandbox.vtpass.com/api/}
  api-key: ${WAVE_VTPASS_API_KEY:}
  public-key: ${WAVE_VTPASS_PUBLIC_KEY:}
  secret-key: ${WAVE_VTPASS_SECRET_KEY:}

wave:
  demo:
    return-verification-code: ${WAVE_RETURN_VERIFICATION_CODE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.wavetransakt: ${WAVE_LOG_LEVEL:INFO}
    org.springframework.security: WARN
